<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đăng nhập</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="card auth-card">
	<h2>Đăng nhập UTEShop</h2>
	<div class="alert alert-error" th:if="${param.error}">Username/email hoặc password không đúng</div>
	<div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất</div>
	<form th:action="@{/login}" method="post">
		<label>Username hoặc Email</label>
		<input type="text" name="username" placeholder="Username hoặc email" required autofocus>
		<label>Password</label>
		<input type="password" name="password" placeholder="Password" required>
		<button class="btn" type="submit">Đăng nhập</button>
	</form>
</div>
</body>
</html>
