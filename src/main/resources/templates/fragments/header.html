<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
	<a class="brand" th:href="@{/}">Lê Đại Thông Shop</a>
	<div class="user" th:if="${#authorization.expression('isAuthenticated()')}">
		<img class="avatar" alt="Avatar"
			th:src="${#strings.isEmpty(#authentication.principal.images) ? '/images/avatar-default.png' : #authentication.principal.images}">
		<div class="user-info">
			<strong th:text="${#authentication.principal.fullName}">Lê Đại Thông</strong>
			<small th:text="${#authentication.principal.username} + ' · ' + ${#authentication.principal.email}">user · mail</small>
		</div>
		<span class="badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
		<form th:action="@{/logout}" method="post">
			<button class="btn btn-outline" type="submit">Đăng xuất</button>
		</form>
	</div>
	<a class="btn" th:unless="${#authorization.expression('isAuthenticated()')}" th:href="@{/login}">Đăng nhập</a>
</header>
</body>
</html>
